<!DOCTYPE html>
<html>
<head>
  <title>Disaster Monitor Dashboard</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --eq: #ff3b30;
      --wf: #ff9500;
      --fl: #30a0ff;
      --bg: rgba(8, 12, 24, 0.92);
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Barlow', sans-serif;
      background: #080c18;
      color: #e0e8ff;
    }

    #map {
      height: 100vh;
      width: 100%;
      filter: saturate(0.7) brightness(0.9);
    }

    /* === PANELS === */
    .ui-overlay { z-index: 1000; position: absolute; }

    .panel {
      top: 48px; left: 16px;
      width: 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 13px;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(200,210,255,0.6);
    }

    .toggle {
      display: flex;
      align-items: center;
      margin: 10px 0;
      cursor: pointer;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    /* custom checkbox */
    .toggle input { display: none; }
    .toggle .dot {
      width: 36px; height: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      position: relative;
      transition: background 0.3s;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .toggle .dot::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      top: 2px; left: 2px;
      background: white;
      transition: transform 0.3s;
    }
    .toggle input:checked + .dot { background: var(--accent); }
    .toggle input:checked + .dot::after { transform: translateX(16px); }

    .toggle-eq .dot { --accent: var(--eq); }
    .toggle-wf .dot { --accent: var(--wf); }
    .toggle-fl .dot { --accent: var(--fl); }

    .toggle-label { display: flex; align-items: center; gap: 7px; }
    .toggle-badge {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* TOP BAR */
    .topbar {
      top: 48px; right: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-family: 'Share Tech Mono', monospace;
      color: rgba(200,210,255,0.7);
      backdrop-filter: blur(12px);
      text-align: right;
      line-height: 1.8;
    }

    /* LEGEND */
    .legend {
      bottom: 20px; left: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      backdrop-filter: blur(12px);
      line-height: 2;
    }

    .legend-row { display: flex; align-items: center; gap: 10px; }
    .legend-sizes {
      display: flex; align-items: center; gap: 4px;
      margin-left: 4px;
    }
    .legend-dot {
      border-radius: 50%;
      display: inline-block;
      border: 1.5px solid rgba(255,255,255,0.4);
    }

    .legend-summary {
      cursor: pointer;
      list-style: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(200,210,255,0.6);
      user-select: none;
    }
    .legend-summary::-webkit-details-marker { display: none; }
    .legend-summary::after { content: '▾'; float: right; margin-left: 8px; }
    .legend[open] .legend-summary::after { content: '▴'; }
    .legend-body { margin-top: 8px; }

    /* STATUS */
    .status {
      bottom: 20px; right: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-family: 'Share Tech Mono', monospace;
      backdrop-filter: blur(12px);
    }

    #status {
      color: #30ff90;
      font-weight: bold;
    }

    .spinner {
      display: none;
      width: 9px; height: 9px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #30ff90;
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* BREAKING NEWS */
    .breaking-news {
      top: 0; width: 100%;
      background: linear-gradient(90deg, #8b0000, #cc0000);
      color: white;
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 13px;
      z-index: 2000;
      letter-spacing: 0.3px;
      border-bottom: 1px solid rgba(255,100,100,0.4);
    }

    .label {
      padding: 7px 14px;
      background: rgba(0,0,0,0.35);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      white-space: nowrap;
      border-right: 1px solid rgba(255,100,100,0.3);
    }

    .ticker { white-space: nowrap; overflow: hidden; flex: 1; }
    .ticker span {
      display: inline-block;
      padding: 7px 0 7px 100%;
      animation: ticker 25s linear infinite;
    }
    .ticker:hover span {
      animation-play-state: paused;
    }

    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* === PULSE ANIMATION for large earthquakes === */
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      animation: pulse-ring 1.8s ease-out infinite;
      pointer-events: none;
    }

    /* Leaflet popup styling */
    .leaflet-popup-content-wrapper {
      background: rgba(10, 14, 28, 0.96) !important;
      color: #dde8ff !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 10px !important;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6) !important;
      font-family: 'Barlow', sans-serif !important;
    }
    .leaflet-popup-tip { background: rgba(10,14,28,0.96) !important; }
    .leaflet-popup-close-button { color: rgba(255,255,255,0.5) !important; }

    .status-time-mobile { display: none; }

    /* === MOBILE === */
    @media (max-width: 640px) {
      body { overscroll-behavior: none; }

      .breaking-news { font-size: 11px; }
      .breaking-news .label { padding: 6px 10px; font-size: 9px; }
      .ticker span { padding: 6px 0 6px 100%; }

      /* Layer toggle panel → compact row right under the ticker, full width */
      .panel {
        top: calc(38px + env(safe-area-inset-top, 0px));
        left: 8px; right: 8px; width: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        gap: 4px;
      }
      .panel h2 { display: none; }
      .toggle {
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin: 0;
        font-size: 10px;
        touch-action: manipulation;
      }
      .toggle .dot { width: 34px; height: 20px; }
      .toggle-label { flex-direction: column; gap: 3px; }

      /* Realtime label box hidden — time shown inline in the status pill instead */
      .topbar { display: none; }
      .status-time-mobile { display: inline; }

      /* Legend → compact, drop the magnitude scale demo dots to save width */
      .legend {
        left: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        padding: 8px 10px;
        font-size: 10px;
        line-height: 1.6;
        max-width: 46%;
      }
      .legend-sizes { display: none; }
      .legend-scale-note { display: none; }

      .status {
        right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        padding: 6px 10px;
        font-size: 10px;
      }

      .leaflet-control-zoom {
        margin-right: 8px !important;
        margin-bottom: 90px !important;
      }
    }

    /* === MOBILE LANDSCAPE — จอกว้างพอแต่สูงจำกัด ต้องประหยัดพื้นที่แนวตั้ง === */
    @media (max-width: 900px) and (orientation: landscape) {
      .breaking-news .label { padding: 4px 8px; }
      .ticker span { padding: 4px 0 4px 100%; }

      .panel { top: 30px; padding: 6px 10px; }
      .toggle { font-size: 9px; }
      .toggle .dot { width: 30px; height: 18px; }

      .legend { padding: 6px 10px; font-size: 9px; line-height: 1.4; max-width: 40%; }
      .legend-summary { font-size: 9px; }

      .status { padding: 4px 8px; font-size: 9px; }

      .leaflet-control-zoom { margin-bottom: 8px !important; }
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- PANEL -->
<div class="panel ui-overlay">
  <h2>⬡ Disaster Layers</h2>

  <label class="toggle toggle-eq">
    <input type="checkbox" checked id="eqToggle">
    <span class="dot"></span>
    <span class="toggle-label">
      <span class="toggle-badge" style="background:var(--eq); box-shadow:0 0 6px var(--eq);"></span>
      Earthquake
    </span>
  </label>

  <label class="toggle toggle-wf">
    <input type="checkbox" checked id="wfToggle">
    <span class="dot"></span>
    <span class="toggle-label">
      <span class="toggle-badge" style="background:var(--wf); box-shadow:0 0 6px var(--wf);"></span>
      Wildfire
    </span>
  </label>

  <label class="toggle toggle-fl">
    <input type="checkbox" checked id="flToggle">
    <span class="dot"></span>
    <span class="toggle-label">
      <span class="toggle-badge" style="background:var(--fl); box-shadow:0 0 6px var(--fl);"></span>
      Flood
    </span>
  </label>
</div>

<!-- TOP BAR -->
<div class="topbar ui-overlay">
  🔄 Realtime Monitoring<br>
  Updated: <span id="time"></span>
</div>

<!-- LEGEND -->
<details class="legend ui-overlay" open>
  <summary class="legend-summary">Legend</summary>
  <div class="legend-body">
    <div class="legend-row">
      <span class="toggle-badge" style="background:var(--eq); box-shadow:0 0 5px var(--eq); width:10px;height:10px;border-radius:50%;display:inline-block;"></span>
      Earthquake
      <span class="legend-sizes">
        <span class="legend-dot" style="width:8px;height:8px;background:var(--eq);opacity:.6;"></span>
        <span class="legend-dot" style="width:14px;height:14px;background:var(--eq);opacity:.8;"></span>
        <span class="legend-dot" style="width:22px;height:22px;background:var(--eq);"></span>
      </span>
      <span class="legend-scale-note" style="font-size:10px;color:rgba(200,210,255,0.5);">M1 → M7+</span>
    </div>
    <div class="legend-row">
      <span style="width:10px;height:10px;border-radius:50%;background:var(--wf);box-shadow:0 0 5px var(--wf);display:inline-block;"></span>
      Wildfire
    </div>
    <div class="legend-row">
      <span style="width:10px;height:10px;border-radius:50%;background:var(--fl);box-shadow:0 0 5px var(--fl);display:inline-block;"></span>
      Flood
    </div>
  </div>
</details>

<!-- STATUS -->
<div class="status ui-overlay">
  Status: <span id="status">Loading...</span><span id="spinner" class="spinner"></span>
  <span class="status-time-mobile"> · <span id="time-mobile"></span></span>
</div>
<div class="breaking-news ui-overlay">
  <span class="label">BREAKING</span>
  <div class="ticker" id="ticker"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openlocationcode/1.0.4/openlocationcode.min.js"></script>
<script>
    console.log("FILE LOADED");

  const map = L.map('map', {
    zoomControl: false
  }).setView([13.7563, 100.5018], 4);

  // มือถือ: เพิ่มปุ่ม +/- ซูมกลับมา เพราะ pinch-to-zoom อย่างเดียวใช้งานลำบากกว่าตอนมือถือถือด้วยมือเดียว
  if (window.matchMedia('(max-width: 640px)').matches) {
    L.control.zoom({ position: 'bottomright' }).addTo(map);
  }

  // มือถือ: ให้ legend เริ่มต้นแบบพับเก็บ ประหยัดพื้นที่จอ (คลิก/แตะเพื่อกางดูได้)
  if (window.matchMedia('(max-width: 640px)').matches) {
    document.querySelector('.legend').removeAttribute('open');
  }

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & Carto',
    }).addTo(map);

    const layers = {
        earthquake: L.layerGroup().addTo(map),
        wildfire: L.layerGroup().addTo(map),
        flood: L.layerGroup().addTo(map)
    };

    function createMarker(lat, lng, type, popup, size) {
      const COLORS = { eq: "#ff3b30", wf: "#ff9500", fl: "#30a0ff" };
      const color = COLORS[type] || "#999";
      const s = size || 14;
      const hit = Math.max(s, 30); // ขยายพื้นที่แตะขั้นต่ำ 30px โดยไม่เปลี่ยนขนาดจุดที่มองเห็น (สำคัญมากบนมือถือ)

      // pulse ring แสดงเฉพาะ earthquake ขนาดใหญ่ (>= 20px = mag ~4+)
      const showPulse = (type === "eq" && s >= 20);
      const ringSize = s * 2.5;
      const ringOffset = -(ringSize - s) / 2;

      const dotHtml = `
        <div style="position:relative; width:${s}px; height:${s}px;">
          ${showPulse ? `
          <div class="pulse-ring" style="
            width:${ringSize}px; height:${ringSize}px;
            border: 2px solid ${color};
            top:${ringOffset}px; left:${ringOffset}px;
          "></div>` : ''}
          <div style="
            width:${s}px; height:${s}px;
            background: radial-gradient(circle at 35% 35%, ${color}ff, ${color}99);
            border-radius: 50%;
            box-shadow: 0 0 ${Math.round(s * 0.7)}px ${color}cc,
                        0 0 ${Math.round(s * 1.4)}px ${color}44;
            border: ${s >= 20 ? 2 : 1.5}px solid rgba(255,255,255,0.6);
            position: absolute; top:0; left:0;
          "></div>
        </div>`;

      const html = `
        <div style="width:${hit}px; height:${hit}px; display:flex; align-items:center; justify-content:center;">
          ${dotHtml}
        </div>`;

      const icon = L.divIcon({
        html,
        className: '',
        iconSize: [hit, hit],
        iconAnchor: [hit / 2, hit / 2]
      });

      const popupMaxWidth = window.innerWidth < 400 ? 200 : 260;
      return L.marker([lat, lng], { icon }).bindPopup(popup, { maxWidth: popupMaxWidth, autoPanPadding: [16, 16] });
    }
    async function loadAlerts(eqDataPromise) {
        //console.log("loadAlerts RUNNING 🔥");
        let alerts = [];

        // ยิง earthquake + EONET พร้อมกัน (เดิมรอทีละอันเรียงกัน)
        // ถ้ามี eqDataPromise ที่ loadData() กำลังยิงอยู่แล้ว ใช้อันเดียวกันเลย ไม่ fetch ซ้ำ
        const [eqData, eonetData] = await Promise.all([
          eqDataPromise || fetchJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson'),
          fetchJSON('https://eonet.gsfc.nasa.gov/api/v3/events?status=open')
        ]);

        //console.log(eqData);

        eqData.features
            .filter(eq => eq.properties.mag >= 5)
            .slice(0, 3)
            .forEach(eq => {
            alerts.push(`🌍 M${eq.properties.mag} - ${eq.properties.place}`);
            });

        // 🔥 + 🌊 EONET
        eonetData.events.slice(0, 3).forEach(ev => {
            alerts.push(`⚠️ ${ev.title}`);
        });

        // ✂️ เอาแค่ 5 ข่าว
        alerts = alerts.slice(0, 5);

        updateTicker(alerts);
        //console.log(alerts);
    }
  function updateTicker(alerts) {
    //console.log("UPDATING TICKER", alerts);
    const ticker = document.getElementById('ticker');

    ticker.innerHTML = `<span>${alerts.join("  •  ")}</span>`;
   }
   
  let lastAlerts = [];

  async function fetchJSON(url) {
    const res = await fetch(url);
    return res.json();
  }

  // ── Global geocoding ─────────────────────────────────────────
  const GEOCODE_API_KEY = '69fdad57cf850933585115gmlce2259';
  const geoCache = {};

  async function reverseGeocode(lat, lng) {
    const key = `${lat.toFixed(2)},${lng.toFixed(2)}`;
    if (geoCache[key]) return geoCache[key];

    try {
      const r = await fetch(
        `https://geocode.maps.co/reverse?lat=${lat}&lon=${lng}&api_key=${GEOCODE_API_KEY}`
      );
      if (r.ok) {
        const d = await r.json();
        const a = d.address || {};
        const province = a.county || a.state_district || a.province
                      || a.state || a.country || null;
        const country  = a.country || '';
        if (province) {
          const result = { province, country };
          geoCache[key] = result;
          return result;
        }
      }
    } catch(e) { console.warn('Geocode error:', e); }

    const result = { province: null, country: '' };
    geoCache[key] = result;
    return result;
  }
  // ─────────────────────────────────────────────────────────────

  // ── Background geocode queue ────────────────────────────────
  // ทุก geocode call (wildfire + flood) วิ่งผ่านคิวนี้ที่เดียว เว้นจังหวะ 1.1 วิ/ครั้ง
  // เพื่อไม่ชน rate limit ของ geocode.maps.co แต่ทำงานแยกจาก loadData() โดยสิ้นเชิง
  // ทำให้ marker ทุกจุดขึ้นและ status เป็น "Live" ได้ทันทีโดยไม่ต้องรอคิวนี้เลย
  const geoQueue = [];
  let geoQueueRunning = false;

  function queueGeocode(task) {
    geoQueue.push(task);
    runGeoQueue();
  }

  async function runGeoQueue() {
    if (geoQueueRunning) return;
    geoQueueRunning = true;
    while (geoQueue.length) {
      const task = geoQueue.shift();
      try { await task(); } catch (e) { console.warn('Geo queue task error:', e); }
      await new Promise(r => setTimeout(r, 1100));
    }
    geoQueueRunning = false;
  }
  // ─────────────────────────────────────────────────────────────

  function makeFloodPopup(title, locationLine, eventDate, mapsUrl) {
    return `
      <div style="line-height:1.6; min-width:210px;">
        <strong style="font-size:14px; color:#30a0ff;">🌊 ${title}</strong><br>
        <hr style="margin:4px 0; border-color:rgba(255,255,255,0.1);">
        📍 ${locationLine}<br>
        ${eventDate ? `🗓 ${eventDate}<br>` : ''}
        <a href="${mapsUrl}" target="_blank" style="font-size:12px; color:#30a0ff;">ดูบน Google Maps →</a>
      </div>`;
  }

  function pinFlood(lat, lng, title, eventDate, layer) {
    const plusCode = OpenLocationCode.encode(lat, lng, 10);
    const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(plusCode)}`;
    const key = `${lat.toFixed(2)},${lng.toFixed(2)}`;
    const cached = geoCache[key];

    const initLine = cached?.province
      ? `${cached.province}${cached.country && cached.country !== cached.province
          ? ` <span style="color:rgba(200,210,255,0.5);font-size:11px;">(${cached.country})</span>` : ''}`
      : `<span style="color:rgba(200,210,255,0.5);font-size:12px;">${lat.toFixed(3)}°, ${lng.toFixed(3)}°</span>`;

    const m = createMarker(lat, lng, 'fl', makeFloodPopup(title, initLine, eventDate, mapsUrl));
    m.addTo(layer);

    if (!cached) {
      queueGeocode(async () => {
        const geo = await reverseGeocode(lat, lng);
        if (geo.province) {
          const locLine = `${geo.province}${geo.country && geo.country !== geo.province
            ? ` <span style="color:rgba(200,210,255,0.5);font-size:11px;">(${geo.country})</span>` : ''}`;
          m.setPopupContent(makeFloodPopup(title, locLine, eventDate, mapsUrl));
        }
      });
    }
    return m;
  }

  function makeWildfirePopup(title, locationLine, eventDate, mapsUrl) {
    return `
      <div style="line-height:1.6; min-width:210px;">
        <strong style="font-size:14px; color:#ff9500;">🔥 ${title}</strong><br>
        <hr style="margin:4px 0; border-color:rgba(255,255,255,0.1);">
        📍 ${locationLine}<br>
        ${eventDate ? `🗓 ${eventDate}<br>` : ''}
        <a href="${mapsUrl}" target="_blank" style="font-size:12px; color:#ff9500;">ดูบน Google Maps →</a>
      </div>`;
  }

  function updateWildfirePopup(m, lat, lng, title, eventDate, mapsUrl) {
    return async () => {
      const geo = await reverseGeocode(lat, lng);
      if (geo.province) {
        const locLine = `${geo.province}${geo.country && geo.country !== geo.province
          ? ` <span style="color:rgba(200,210,255,0.5);font-size:11px;">(${geo.country})</span>` : ''}`;
        m.setPopupContent(makeWildfirePopup(title, locLine, eventDate, mapsUrl));
      }
    };
  }

  // ── fetch พร้อม timeout + retry สำหรับ Flood API โดยเฉพาะ ──────
  // ป้องกันไม่ให้ Flood API ที่ตอบช้าหรือค้าง ทำให้ loadData() ต้องรอนาน
  async function fetchWithTimeoutRetry(url, { timeoutMs = 8000, retries = 2, retryDelayMs = 1000, fetchOpts = {} } = {}) {
    let lastErr;
    for (let attempt = 0; attempt <= retries; attempt++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...fetchOpts, signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        clearTimeout(timer);
        lastErr = err;
        const isTimeout = err.name === 'AbortError';
        console.warn(`⚠️ Flood fetch attempt ${attempt + 1}/${retries + 1} failed (${isTimeout ? 'timeout' : err.message}): ${url}`);
        if (attempt < retries) {
          await new Promise(r => setTimeout(r, retryDelayMs));
        }
      }
    }
    throw lastErr;
  }
  // ─────────────────────────────────────────────────────────────

  async function loadFloods() {
    layers.flood.clearLayers();
    try {
      // ✅ เรียกข้อมูล Flood สดโดยตรงจาก EONET (live API) เป็นแหล่งหลัก
      const data = await fetchWithTimeoutRetry(
        'https://eonet.gsfc.nasa.gov/api/v3/events?category=floods&status=open',
        { timeoutMs: 8000, retries: 2, retryDelayMs: 1200 }
      );

      if (data.events && data.events.length > 0) {
        const jobs = [];
        for (const flood of data.events) {
          const g = flood.geometry[0];
          if (!g) continue;
          const [lng, lat] = g.coordinates;
          const eventDate = g.date ? g.date.split('T')[0] : '';
          jobs.push({ lat, lng, title: flood.title, eventDate });
        }

        // ปัก marker ทั้งหมดทันที ไม่มี delay ในลูปนี้เลย — geocode วิ่งผ่านคิวเบื้องหลังแยกต่างหาก
        for (const job of jobs) {
          pinFlood(job.lat, job.lng, job.title, job.eventDate, layers.flood);
        }
        console.log(`✅ Flood (EONET live): ${jobs.length} เหตุการณ์`);
      } else {
        console.log('ℹ️ Flood (EONET live): ไม่มีเหตุการณ์เปิดอยู่ → ใช้ fallback (result.geojson)');
        await loadFloodsFromGDACS();
      }
    } catch (err) {
      console.error('❌ EONET Flood error (หมด retry แล้ว) → fallback (result.geojson):', err.message);
      await loadFloodsFromGDACS();
    }
  }

  // ⚠️ Fallback เท่านั้น — ใช้เมื่อ EONET live API ล้มเหลวหรือไม่มีข้อมูล
  // result.geojson เป็นไฟล์สแนปช็อตสำรอง ไม่ใช่แหล่งข้อมูลหลักอีกต่อไป
  async function loadFloodsFromGDACS() {
    try {
      const data = await fetchWithTimeoutRetry(
        "result.geojson?t=" + Date.now(),
        { timeoutMs: 5000, retries: 1, retryDelayMs: 800, fetchOpts: { cache: 'no-store' } }
      );

      const today = new Date();
      const daysInCurrentMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
      const endDate = new Date(today.getFullYear(), today.getMonth(), daysInCurrentMonth);

      // const startDate = new Date("2026-06-01");
      // const endDate = new Date("2026-07-31");
      const startDate = new Date(endDate);
      startDate.setDate(endDate.getDate() - 60);
      console.log(`🌊 Flood (fallback result.geojson) กรองช่วง: ${startDate.toLocaleDateString('th-TH')} - ${endDate.toLocaleDateString('th-TH')}`);

      const filtered = data.features.filter(f => {
        const eventTime = new Date(f.properties.datemodified);
        return (
          f.properties.eventtype === "FL" &&
          f.properties.alertlevel === "Orange" &&
          eventTime >= startDate &&
          eventTime <= endDate
        );
      });

      console.log(`✅ Flood (fallback result.geojson): ${filtered.length} เหตุการณ์ (จากทั้งหมด ${data.features.length})`);

      for (const f of filtered) {
        const [lng, lat] = f.geometry.coordinates;
        if (!isNaN(lat) && !isNaN(lng)) {
          const props = f.properties;
          const eventDate = props.datemodified ? props.datemodified.split('T')[0] : '';
          // GDACS มีชื่อประเทศอยู่แล้ว ไม่ต้อง geocode ซ้ำ
          const plusCode = OpenLocationCode.encode(lat, lng, 10);
          const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(plusCode)}`;
          const locLine = `${props.name || ''}${props.country ? `, ${props.country}` : ''}`;
          const m = createMarker(lat, lng, 'fl', makeFloodPopup(props.name || 'Flood', locLine, eventDate, mapsUrl));
          m.addTo(layers.flood);
        }
      }
    } catch (err) {
      console.error("GDACS ERROR:", err);
    }
  }

  async function loadData(eqDataPromise) {
    document.getElementById('status').innerText = "Updating...";
    document.getElementById('spinner').style.display = 'inline-block';

    layers.earthquake.clearLayers();
    layers.wildfire.clearLayers();
    layers.flood.clearLayers();

    // ยิงทั้ง 3 แหล่งข้อมูลพร้อมกันตั้งแต่ต้น (เดิมรอ eq → wildfire → flood เรียงกัน)
    const floodsPromise = loadFloods();
    const wfPromise = fetchJSON('https://eonet.gsfc.nasa.gov/api/v3/events?category=wildfires&status=all&days=30');

    // 🌍 Earthquake — ใช้ promise ที่ยิงไว้แล้วตอนโหลดหน้าเว็บครั้งแรก ถ้ามี ไม่ fetch ซ้ำ
    const eqData = await (eqDataPromise || fetchJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson'));

    eqData.features.forEach(eq => {
      const [lng, lat] = eq.geometry.coordinates;
      const mag = eq.properties.mag || 0;
      // scale marker size เหมือนเว็บ USGS: mag 1=8px, mag 5=20px, mag 8+=36px
      // mag scale: <1=6px, 3=12px, 5=22px, 7=34px, 8+=42px
      // const size = mag <= 0 ? 6 : Math.round(Math.max(6, Math.min(42, Math.pow(mag, 1.6) * 3.2 + 4)));
      let size;
      if (mag <= 1) {
        size = 6;         // Smallest size for low magnitude
      } else if (mag >= 1 && mag < 3) {
        size = 12;        // Medium size
      } else if (mag >= 3 && mag < 5) {
        size = 22;        // Large size
      } else if (mag >= 5 && mag < 7) {
        size = 36;        // Very Large size
      } else { // mag >= 7
        size = 42;        // Largest size for high magnitude
      }

      const time = eq.properties.time ? new Date(eq.properties.time).toLocaleString('th-TH') : '-';
      const depth = eq.geometry.coordinates[2]?.toFixed(1) ?? '-';
      const popup = `
        <div style="line-height:1.6; min-width:180px;">
          <strong style="font-size:15px; color:#ff3b30;">🌍 Magnitude ${mag}</strong><br>
          <hr style="margin:4px 0;">
          📍 ${eq.properties.place}<br>
          🕐 ${time}<br>
          📏 ความลึก: ${depth} km<br>
          <a href="${eq.properties.url}" target="_blank" style="font-size:12px;">ดูรายละเอียด USGS →</a>
        </div>`;
      const m = createMarker(lat, lng, 'eq', popup, size);
      m.addTo(layers.earthquake);
    });

    // 🔥 Wildfire — request ยิงไปพร้อมกับ eq/flood ด้านบนแล้ว แค่มารอผลตรงนี้
    const wfData = await wfPromise;

    // ปัก marker ทันทีด้วยพิกัดก่อน แล้วค่อย geocode หาชื่อจังหวัด/ประเทศแบบ background
    // (ไม่ await ทำให้ marker ทุกจุดขึ้นพร้อมกันทันที ไม่ต้องรอทีละจุด)
    for (const f of wfData.events) {
      const g = f.geometry[0];
      if (!g) continue;
      const [lng, lat] = g.coordinates;
      const eventDate = g.date ? g.date.split('T')[0] : '';
      const plusCode = OpenLocationCode.encode(lat, lng, 10);
      const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(plusCode)}`;
      const key = `${lat.toFixed(2)},${lng.toFixed(2)}`;

      // ถ้ามี cache อยู่แล้วใช้ได้ทันที ไม่มีก็ขึ้นพิกัดไปก่อนแล้วอัปเดตทีหลัง
      const cached = geoCache[key];
      const locationLine = cached?.province
        ? `${cached.province}${cached.country && cached.country !== cached.province
            ? ` <span style="color:rgba(200,210,255,0.5);font-size:11px;">(${cached.country})</span>`
            : ''}`
        : `<span style="color:rgba(200,210,255,0.5);font-size:12px;">${lat.toFixed(3)}°, ${lng.toFixed(3)}°</span>`;

      const m = createMarker(lat, lng, 'wf', makeWildfirePopup(f.title, locationLine, eventDate, mapsUrl));
      m.addTo(layers.wildfire);

      // geocode แบบไม่บล็อกลูปเลย — เข้าคิวเบื้องหลังแยกต่างหาก
      if (!cached) {
        queueGeocode(updateWildfirePopup(m, lat, lng, f.title, eventDate, mapsUrl));
      }
    }

    // 🌊 Flood — request ยิงไปพร้อมกับอันอื่นตั้งแต่ต้นฟังก์ชันแล้ว ไม่ await ตรงนี้
    // เพื่อไม่ให้ Flood ที่โหลดช้า (หรือ timeout/retry) บล็อก Earthquake/Wildfire และ Status "Live"
    floodsPromise
      .then(() => console.log('🌊 Flood loading เสร็จสิ้น (แบบไม่บล็อก status)'))
      .catch(err => console.error('❌ Flood loading ล้มเหลวทั้งหมด (EONET + fallback):', err));

    document.getElementById('status').innerText = "Live";
    document.getElementById('spinner').style.display = 'none';
    const nowStr = new Date().toLocaleTimeString();
    document.getElementById('time').innerText = nowStr;
    document.getElementById('time-mobile').innerText = nowStr;
  }

  // Toggle layer
  document.getElementById('eqToggle').onchange = e => {
    e.target.checked ? map.addLayer(layers.earthquake) : map.removeLayer(layers.earthquake);
  };
  document.getElementById('wfToggle').onchange = e => {
    e.target.checked ? map.addLayer(layers.wildfire) : map.removeLayer(layers.wildfire);
  };
  document.getElementById('flToggle').onchange = e => {
    e.target.checked ? map.addLayer(layers.flood) : map.removeLayer(layers.flood);
  };

  // โหลดครั้งแรก: ยิง earthquake ครั้งเดียว แชร์ผลลัพธ์ให้ทั้ง loadData และ loadAlerts ใช้ร่วมกัน
  const initialEqPromise = fetchJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson');
  loadData(initialEqPromise);
  loadAlerts(initialEqPromise);
  setInterval(() => { loadData(); loadAlerts(); }, 300000);
      
</script>
